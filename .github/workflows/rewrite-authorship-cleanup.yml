name: Rewrite authorship and clean branches

on:
  push:
    branches: [chore/rewrite-authorship-cleanup-20260730]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  rewrite-and-clean:
    if: github.ref == 'refs/heads/chore/rewrite-authorship-cleanup-20260730' || github.head_ref == 'chore/rewrite-authorship-cleanup-20260730'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild clean contribution branch
        shell: bash
        env:
          TARGET_BRANCH: sync/neoforge-1.21.1-upstream-1.15.2
          BASE_BRANCH: main
          CONTRIBUTOR_NAME: nekomario28
          CONTRIBUTOR_EMAIL: 206304251+nekomario28@users.noreply.github.com
        run: |
          set -euo pipefail

          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune
          old_commit="$(git rev-parse "origin/${TARGET_BRANCH}")"
          base_commit="$(git rev-parse "origin/${BASE_BRANCH}")"
          merge_base="$(git merge-base "${base_commit}" "${old_commit}")"

          if [[ "${merge_base}" != "${base_commit}" ]]; then
            echo "Target branch is not based directly on current main." >&2
            exit 1
          fi

          old_tree="$(git rev-parse "${old_commit}^{tree}")"
          export GIT_AUTHOR_NAME="${CONTRIBUTOR_NAME}"
          export GIT_AUTHOR_EMAIL="${CONTRIBUTOR_EMAIL}"
          export GIT_COMMITTER_NAME="${CONTRIBUTOR_NAME}"
          export GIT_COMMITTER_EMAIL="${CONTRIBUTOR_EMAIL}"

          new_commit="$(cat <<'EOF' | git commit-tree "${old_tree}" -p "${base_commit}"
Port Villager Recruits 1.15.2 to NeoForge 1.21.1

Migrate Villager Recruits 1.15.2 from Forge to NeoForge for Minecraft 1.21.1 while preserving the synchronized upstream feature set and correcting client/server API boundaries required by dedicated servers.

Validated with Recruits GameTests, persistence checks across separate server processes, production JAR audits, a dedicated-server startup, cross-mod Workers integration, and Xvfb client smoke tests.
EOF
          )"

          new_tree="$(git rev-parse "${new_commit}^{tree}")"
          test "${new_tree}" = "${old_tree}"

          git push origin "${new_commit}:refs/heads/${TARGET_BRANCH}" \
            --force-with-lease="refs/heads/${TARGET_BRANCH}:${old_commit}"

          echo "old_commit=${old_commit}" >> "${GITHUB_STEP_SUMMARY}"
          echo "new_commit=${new_commit}" >> "${GITHUB_STEP_SUMMARY}"
          echo "tree=${new_tree}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Remove explicitly obsolete branches
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune

          delete_with_lease() {
            local branch="$1"
            local remote_ref="refs/remotes/origin/${branch}"
            if ! git show-ref --verify --quiet "${remote_ref}"; then
              return 0
            fi
            local expected
            expected="$(git rev-parse "${remote_ref}")"
            git push origin --delete "${branch}" \
              --force-with-lease="refs/heads/${branch}:${expected}"
          }

          obsolete_branches=(
            agent/recruits-neoforge-1.21.1-archive
            port/neoforge-1.21.1-start
            port/neoforge-1.21.1
            test/recruits-dedicated-fix
            test/recruits-final-validation
            test/recruits-upstream-sync-analysis
            test/recruits-sync-repair
          )

          for branch in "${obsolete_branches[@]}"; do
            delete_with_lease "${branch}"
          done

          delete_with_lease "${GITHUB_REF_NAME}"
