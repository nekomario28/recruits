name: Temporary Recruits Safe Logic Fixes

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-safe-fixes:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out validation branch
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Apply exact safe fixes
        shell: bash
        run: |
          set -euo pipefail
          SOURCE="$RUNNER_TEMP/recruits-safe-fixes"
          git clone --branch port/neoforge-1.21.1 https://github.com/nekomario28/recruits.git "$SOURCE"
          cd "$SOURCE"
          test "$(git rev-parse HEAD)" = "1bcf04c750b70285001163eeac7b1bc44fe11be0"
          python3 - <<'PY'
          from pathlib import Path

          recruit = Path('src/main/java/com/talhanation/recruits/entities/AbstractRecruitEntity.java')
          text = recruit.read_text()
          old = 'return player.getUUID() == this.getOwnerUUID() || player == this.getOwner();'
          new = 'return player.getUUID().equals(this.getOwnerUUID()) || player == this.getOwner();'
          if text.count(old) != 1:
              raise RuntimeError(f'Expected one owner UUID identity comparison, found {text.count(old)}')
          recruit.write_text(text.replace(old, new))

          events = Path('src/main/java/com/talhanation/recruits/VillagerEvents.java')
          text = events.read_text()

          old = '''        if(event.getLevel().isClientSide() && event.getEntity() instanceof Player player){
              if(Minecraft.getInstance().player.getUUID().equals(player.getUUID())){
                  RecruitsHireTradesRegistry.registerTrades();
              }
          }'''
          new = '''        if (event.getLevel().isClientSide() && event.getEntity() instanceof Player player) {
              Player clientPlayer = Minecraft.getInstance().player;
              if (clientPlayer != null && clientPlayer.getUUID().equals(player.getUUID())) {
                  RecruitsHireTradesRegistry.registerTrades();
              }
          }'''
          if text.count(old) != 1:
              raise RuntimeError('Client join handler source did not match expected form')
          text = text.replace(old, new)

          old = '''        Entity entity = event.getEntity();
          if(!RecruitsServerConfig.NobleVillagerSpawn.get()) return;'''
          new = '''        Entity entity = event.getEntity();
          if (event.getLevel().isClientSide()) return;
          if(!RecruitsServerConfig.NobleVillagerSpawn.get()) return;'''
          if text.count(old) != 1:
              raise RuntimeError('Villager join handler source did not match expected form')
          text = text.replace(old, new)

          old = '''        Entity entity = event.getEntity();
          if (entity instanceof Villager villager) {'''
          new = '''        Entity entity = event.getEntity();
          if (entity.getCommandSenderWorld().isClientSide()) return;
          if (entity instanceof Villager villager) {'''
          if text.count(old) != 1:
              raise RuntimeError('Villager tick handler source did not match expected form')
          text = text.replace(old, new)

          old = '''                    int i = this.random.nextInt(6);
                      if (i == 1) createBowmanIronGolem(ironGolemEntity);
                      if (i == 2) createCrossbowmanIronGolem(ironGolemEntity);
                      else if (i == 0) createRecruitShieldmanIronGolem(ironGolemEntity);
                      else createRecruitIronGolem(ironGolemEntity);'''
          new = '''                    int i = this.random.nextInt(6);
                      switch (i) {
                          case 0 -> createRecruitShieldmanIronGolem(ironGolemEntity);
                          case 1 -> createBowmanIronGolem(ironGolemEntity);
                          case 2 -> createCrossbowmanIronGolem(ironGolemEntity);
                          default -> createRecruitIronGolem(ironGolemEntity);
                      }'''
          if text.count(old) != 1:
              raise RuntimeError('Iron Golem conversion branch did not match expected form')
          text = text.replace(old, new)

          old = '''        villager.remove(Entity.RemovalReason.DISCARDED);
          recruit.getInventory().setItem(8, Items.BREAD.getDefaultInstance());
          villager.remove(Entity.RemovalReason.DISCARDED);'''
          new = '''        recruit.getInventory().setItem(8, Items.BREAD.getDefaultInstance());
          villager.remove(Entity.RemovalReason.DISCARDED);'''
          if text.count(old) != 1:
              raise RuntimeError('Duplicate Golem removal did not match expected form')
          text = text.replace(old, new)

          events.write_text(text)
          PY
          git diff --check
          grep -F 'player.getUUID().equals(this.getOwnerUUID())' src/main/java/com/talhanation/recruits/entities/AbstractRecruitEntity.java
          grep -F 'switch (i)' src/main/java/com/talhanation/recruits/VillagerEvents.java
          test "$(grep -c 'villager.remove(Entity.RemovalReason.DISCARDED);' src/main/java/com/talhanation/recruits/VillagerEvents.java)" -eq 4

      - name: Compile fixed source
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/recruits-safe-fixes"
          chmod +x gradlew
          ./gradlew --no-daemon clean compileJava --stacktrace 2>&1 | tee "$RUNNER_TEMP/recruits-safe-fixes-build.log"

      - name: Commit fixed source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/recruits-safe-fixes"
          git add src/main/java/com/talhanation/recruits/entities/AbstractRecruitEntity.java \
                  src/main/java/com/talhanation/recruits/VillagerEvents.java
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'Fix ownership and villager conversion logic'
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/nekomario28/recruits.git"
          git fetch origin port/neoforge-1.21.1
          git rebase origin/port/neoforge-1.21.1
          git push origin HEAD:port/neoforge-1.21.1
          git rev-parse HEAD | tee "$RUNNER_TEMP/recruits-safe-fixes-head.txt"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recruits-safe-logic-fixes
          path: |
            ${{ runner.temp }}/recruits-safe-fixes-build.log
            ${{ runner.temp }}/recruits-safe-fixes-head.txt
          if-no-files-found: warn
          retention-days: 3
