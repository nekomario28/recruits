name: Temporary Recruits Restore Full Validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/recruits-sync-repair
          fetch-depth: 0
      - name: Restore full validation workflow with repaired SHA
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git show 089c099334e78064ba7efb2b64f26d60e584b2c9:.github/workflows/temporary-recruits-sync-repair-route.yml \
            > .github/workflows/temporary-recruits-sync-repair-route.yml.next
          sed 's/e644580c5ff3fa3dfbec4fb470d145ffdd83ba17/ecfe4b59167bb72460ce7b015ff6391eb39d0463/g' \
            .github/workflows/temporary-recruits-sync-repair-route.yml.next \
            > .github/workflows/temporary-recruits-sync-repair-route.yml
          rm .github/workflows/temporary-recruits-sync-repair-route.yml.next
          grep -F 'RECRUITS_SHA: ecfe4b59167bb72460ce7b015ff6391eb39d0463' \
            .github/workflows/temporary-recruits-sync-repair-route.yml
          git add .github/workflows/temporary-recruits-sync-repair-route.yml
          git diff --cached --check
          git commit -m 'Run full validation for repaired 1.15.2 sync'
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/nekomario28/recruits.git"
          git push origin HEAD:test/recruits-sync-repair
          git rev-parse HEAD | tee "$RUNNER_TEMP/restored-validation-head.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: recruits-restored-validation-head
          path: ${{ runner.temp }}/restored-validation-head.txt
          if-no-files-found: error
          retention-days: 7
