name: Temporary Recruits API Repair Diagnostic

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Diagnose exact sync tree
        shell: bash
        run: |
          set -u
          ROOT="$RUNNER_TEMP/api-diagnostic"
          REPO="$ROOT/repo"
          OUT="$ROOT/evidence"
          mkdir -p "$OUT"
          {
            git clone --branch sync/neoforge-1.21.1-upstream-1.15.2 https://github.com/nekomario28/recruits.git "$REPO"
            cd "$REPO"
            echo "head=$(git rev-parse HEAD)"
            python3 - <<'PY'
            from pathlib import Path
            import re
            root = Path('src/main/java')
            wanted = ['ChunkTileManager', 'WorldMapContextMenu', 'ClaimInfoMenu', 'RouteNamePopup', 'RouteEditPopup', 'WaypointEditPopup']
            found = {}
            for p in root.rglob('*.java'):
                text = p.read_text(errors='ignore')
                pm = re.search(r'^package\s+([^;]+);', text, re.M)
                if not pm:
                    continue
                for name in wanted:
                    if re.search(r'\b(class|record|interface)\s+' + re.escape(name) + r'\b', text):
                        found[name] = (pm.group(1) + '.' + name, str(p))
            for name in wanted:
                print(name, found.get(name))

            p = Path('src/main/java/com/talhanation/recruits/client/events/ClientEvent.java')
            s = p.read_text()
            pattern = r'\n\s*@SubscribeEvent\n\s*public static void textureStitchCompleted\(TextureStitchEvent\.Post event\) \{\n\s*if \(TextureAtlas\.LOCATION_BLOCKS\.equals\(event\.getAtlas\(\)\.location\(\)\)\) \{\n\s*WorldMapCacheManager\.getInstance\(\)\.onClientBlockAtlasStitched\(\);\n\s*\}\n\s*\}\n'
            print('texture_handler_matches', len(re.findall(pattern, s)))
            print('client_mixin_exists', Path('src/main/java/com/talhanation/recruits/mixin/client/ClientLevelMixin.java').exists())
            PY
          } > "$OUT/diagnostic.log" 2>&1
          cat "$OUT/diagnostic.log"
      - name: Upload diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: recruits-api-repair-diagnostic
          path: ${{ runner.temp }}/api-diagnostic/evidence
          if-no-files-found: error
          retention-days: 7
