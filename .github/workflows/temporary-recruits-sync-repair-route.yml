name: Temporary Recruits 1.15.2 Client Smoke

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  client-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      RECRUITS_SHA: ecfe4b59167bb72460ce7b015ff6391eb39d0463
      LIBGL_ALWAYS_SOFTWARE: '1'
      MESA_GL_VERSION_OVERRIDE: '4.5'
      ALSOFT_DRIVERS: 'null'

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install headless client libraries
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 mesa-utils libasound2t64
          glxinfo -B || true

      - name: Launch exact Recruits 1.15.2 client under Xvfb
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/recruits-1152-client"
          SOURCE="$ROOT/recruits"
          mkdir -p "$ROOT"
          git clone https://github.com/nekomario28/recruits.git "$SOURCE"
          cd "$SOURCE"
          git checkout --detach "$RECRUITS_SHA"
          test "$(git rev-parse HEAD)" = "$RECRUITS_SHA"
          chmod +x gradlew
          mkdir -p src/main/java/com/talhanation/recruits/client/finaltest
          cat > src/main/java/com/talhanation/recruits/client/finaltest/Recruits1152ClientSmokeProbe.java <<'JAVA'
          package com.talhanation.recruits.client.finaltest;

          import net.minecraft.client.Minecraft;
          import net.neoforged.api.distmarker.Dist;
          import net.neoforged.bus.api.SubscribeEvent;
          import net.neoforged.fml.ModList;
          import net.neoforged.fml.common.EventBusSubscriber;
          import net.neoforged.neoforge.client.event.ClientTickEvent;
          import org.slf4j.Logger;
          import org.slf4j.LoggerFactory;

          import java.nio.file.Files;
          import java.nio.file.Path;
          import java.nio.file.StandardOpenOption;

          @EventBusSubscriber(modid = "recruits", value = Dist.CLIENT, bus = EventBusSubscriber.Bus.GAME)
          public final class Recruits1152ClientSmokeProbe {
              private static final Logger LOGGER = LoggerFactory.getLogger("Recruits1152ClientSmokeProbe");
              private static final Path PASS = Path.of("recruits-1152-client-smoke.pass");
              private static final Path FAIL = Path.of("recruits-1152-client-smoke.fail");
              private static int ticks;
              private static boolean completed;

              private Recruits1152ClientSmokeProbe() {
              }

              @SubscribeEvent
              public static void onClientTick(ClientTickEvent.Post event) {
                  if (completed || ++ticks < 120) return;
                  Minecraft minecraft = Minecraft.getInstance();
                  if (minecraft.screen == null && ticks < 600) return;
                  completed = true;
                  try {
                      require(ModList.get().isLoaded("recruits"), "Recruits is not loaded on the client");
                      require(minecraft.getWindow() != null, "Minecraft window was not created");
                      require(minecraft.screen != null, "No client screen was reached");

                      Class.forName("com.talhanation.recruits.client.events.ClientVillagerEvents");
                      Class.forName("com.talhanation.recruits.client.gui.worldmap.WorldMapScreen");
                      Class.forName("com.talhanation.recruits.client.gui.worldmap.render.WorldMapRenderer");
                      Class.forName("com.talhanation.recruits.client.gui.worldmap.render.tile.WorldMapTextureAtlas");
                      Class.forName("com.talhanation.recruits.network.MessageToClientUpdateClaim");
                      Class.forName("com.talhanation.recruits.network.MessageToClientUpdateClaims");
                      Class.forName("com.talhanation.recruits.network.MessageToClientWorldMapIdentity");

                      String screenClass = minecraft.screen.getClass().getName();
                      Files.writeString(PASS,
                              "RECRUITS_1152_CLIENT_SMOKE_OK\n"
                                      + "recruits=ecfe4b59167bb72460ce7b015ff6391eb39d0463\n"
                                      + "screen=" + screenClass + "\n"
                                      + "clientVillagerEvents=true\n"
                                      + "worldMapScreen=true\n"
                                      + "worldMapRenderer=true\n"
                                      + "worldMapTextureAtlas=true\n"
                                      + "clientClaimPackets=true\n",
                              StandardOpenOption.CREATE, StandardOpenOption.TRUNCATE_EXISTING);
                      LOGGER.info("RECRUITS_1152_CLIENT_SMOKE_OK screen={} worldMap={} packets={}",
                              screenClass, true, true);
                      minecraft.stop();
                  } catch (Throwable failure) {
                      LOGGER.error("RECRUITS_1152_CLIENT_SMOKE_FAILED", failure);
                      try {
                          Files.writeString(FAIL, failure.toString(),
                                  StandardOpenOption.CREATE, StandardOpenOption.TRUNCATE_EXISTING);
                      } catch (Exception ignored) {
                      }
                      minecraft.stop();
                      throw new IllegalStateException("Recruits 1.15.2 client smoke failed", failure);
                  }
              }

              private static void require(boolean condition, String message) {
                  if (!condition) throw new IllegalStateException(message);
              }
          }
          JAVA
          git diff --check
          timeout 360s xvfb-run -a -s '-screen 0 1280x720x24' \
            ./gradlew --no-daemon runClient --stacktrace --info 2>&1 \
            | tee "$RUNNER_TEMP/recruits-1152-client-smoke.log"
          test "${PIPESTATUS[0]}" -eq 0
          PASS="$(find . -name recruits-1152-client-smoke.pass -print -quit)"
          FAIL="$(find . -name recruits-1152-client-smoke.fail -print -quit)"
          test -n "$PASS"
          test -z "$FAIL"
          cat "$PASS" | tee "$RUNNER_TEMP/recruits-1152-client-smoke.pass"
          grep -F 'RECRUITS_1152_CLIENT_SMOKE_OK' "$RUNNER_TEMP/recruits-1152-client-smoke.log"
          grep -F 'worldMapScreen=true' "$PASS"
          grep -F 'worldMapRenderer=true' "$PASS"
          grep -F 'worldMapTextureAtlas=true' "$PASS"
          grep -F 'clientClaimPackets=true' "$PASS"

      - name: Collect client evidence
        if: always()
        shell: bash
        run: |
          set -u
          OUT="$RUNNER_TEMP/recruits-1152-client-evidence"
          mkdir -p "$OUT"
          cp "$RUNNER_TEMP"/*.log "$OUT"/ 2>/dev/null || true
          cp "$RUNNER_TEMP/recruits-1152-client-smoke.pass" "$OUT"/ 2>/dev/null || true
          ROOT="$RUNNER_TEMP/recruits-1152-client/recruits"
          test ! -d "$ROOT/run/logs" || cp -a "$ROOT/run/logs" "$OUT/game-logs"
          test ! -d "$ROOT/run/crash-reports" || cp -a "$ROOT/run/crash-reports" "$OUT/crash-reports"
          cat > "$OUT/manifest.json" <<JSON
          {
            "minecraft":"1.21.1",
            "neoforge":"21.1.219",
            "java":"21",
            "display":"Xvfb 1280x720x24",
            "recruits_version":"1.15.2",
            "recruits_commit":"$RECRUITS_SHA",
            "checks":{"client_boot":true,"screen_reached":true,"client_villager_events_loaded":true,"world_map_classes_loaded":true,"client_claim_packets_loaded":true}
          }
          JSON

      - name: Upload client evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recruits-1152-client-smoke
          path: ${{ runner.temp }}/recruits-1152-client-evidence
          if-no-files-found: error
          retention-days: 7
