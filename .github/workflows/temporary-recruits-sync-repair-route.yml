name: Temporary Recruits Upstream Sync Pre-Gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pre-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Version and audit exact isolated sync branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/upstream-sync-pre-gate"
          REPO="$ROOT/repo"
          OUT="$ROOT/evidence"
          mkdir -p "$OUT"
          exec > >(tee "$OUT/pre-gate.log") 2>&1

          git clone --branch sync/neoforge-1.21.1-upstream-1.15.2 "https://x-access-token:${GH_TOKEN}@github.com/nekomario28/recruits.git" "$REPO"
          cd "$REPO"
          test "$(git rev-parse HEAD)" = "0ceea2a1b0d7adac15bd5fbca422d9ccd907f8b3"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

          python3 - <<'PY'
          from pathlib import Path
          p = Path('gradle.properties')
          s = p.read_text()
          old = 'mod_version=1.15.0\n'
          if s.count(old) != 1:
              raise SystemExit(f'old version count={s.count(old)}')
          p.write_text(s.replace(old, 'mod_version=1.15.2\n', 1))
          PY
          git add gradle.properties
          git diff --cached --check
          git commit -m 'Update synchronized port version to 1.15.2'
          git push origin HEAD:sync/neoforge-1.21.1-upstream-1.15.2
          SYNC_SHA="$(git rev-parse HEAD)"
          echo "$SYNC_SHA" > "$OUT/sync-head.txt"

          chmod +x gradlew
          ./gradlew --no-daemon clean compileJava shadowJar --stacktrace 2>&1 | tee "$OUT/build.log"
          JAR="$(find build/libs -maxdepth 1 -name '*-all.jar' -print -quit)"
          test -n "$JAR"
          cp "$JAR" "$OUT/recruits-1.21.1-1.15.2-sync-all.jar"

          {
            echo "sync_sha=$SYNC_SHA"
            echo "minecraft=1.21.1"
            echo "neoforge=21.1.219"
            echo "java=21"
            echo "mod_version=$(sed -n 's/^mod_version=//p' gradle.properties)"
            echo
            echo '[source diff check]'
            git diff --check
            echo PASS
            echo
            echo '[legacy Forge imports]'
            if grep -R --line-number --include='*.java' 'net\.minecraftforge\.' src/main/java; then
              echo FAIL
              exit 1
            fi
            echo PASS
            echo
            echo '[legacy MinecraftForge references]'
            if grep -R --line-number --include='*.java' '\bMinecraftForge\b' src/main/java; then
              echo FAIL
              exit 1
            fi
            echo PASS
            echo
            echo '[mixin source existence]'
            python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('src/main/resources/mixins.recruits.json').read_text())
          base=Path('src/main/java/com/talhanation/recruits/mixin')
          missing=[]
          for section in ('mixins','client'):
              for name in data.get(section,[]):
                  path=base/Path(*name.split('.')).with_suffix('.java')
                  if not path.exists(): missing.append(str(path))
          print('missing_mixins=',len(missing))
          if missing:
              print('\n'.join(missing))
              raise SystemExit(1)
          PY
            echo PASS
            echo
            echo '[jar integrity]'
            unzip -t "$JAR" >/dev/null
            echo PASS
            echo
            echo '[jar duplicate entries]'
            python3 - "$JAR" <<'PY'
          import sys,zipfile
          from collections import Counter
          with zipfile.ZipFile(sys.argv[1]) as z:
              c=Counter(z.namelist())
          dup=[n for n,v in c.items() if v>1]
          print('duplicate_entries=',len(dup))
          if dup:
              print('\n'.join(dup[:50]))
              raise SystemExit(1)
          PY
            echo
            echo '[corelib relocation]'
            if unzip -Z1 "$JAR" | grep -q '^de/maxhenkel/corelib/'; then
              echo 'FAIL: unrelocated CoreLib classes remain'
              exit 1
            fi
            test "$(unzip -Z1 "$JAR" | grep -c '^de/maxhenkel/recruits/corelib/' || true)" -gt 0
            echo PASS
            echo
            echo '[temporary probe classes]'
            if unzip -Z1 "$JAR" | grep -E 'gametest|finaltest|RestartProbe|ClientSmokeProbe'; then
              echo FAIL
              exit 1
            fi
            echo PASS
          } 2>&1 | tee "$OUT/audit.txt"

          sha256sum "$OUT/recruits-1.21.1-1.15.2-sync-all.jar" > "$OUT/jar-sha256.txt"
      - name: Upload pre-gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recruits-upstream-sync-pre-gate
          path: ${{ runner.temp }}/upstream-sync-pre-gate/evidence
          if-no-files-found: warn
          retention-days: 7
