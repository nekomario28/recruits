name: Temporary Recruits Client Packet Boundary Repair

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Restore client-only packet boundaries
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/client-packet-boundary"
          REPO="$ROOT/repo"
          OUT="$ROOT/evidence"
          mkdir -p "$OUT"
          exec > >(tee "$OUT/repair.log") 2>&1
          git clone --branch sync/neoforge-1.21.1-upstream-1.15.2 "https://x-access-token:${GH_TOKEN}@github.com/nekomario28/recruits.git" "$REPO"
          cd "$REPO"
          test "$(git rev-parse HEAD)" = "e644580c5ff3fa3dfbec4fb470d145ffdd83ba17"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

          python3 - <<'PY'
          from pathlib import Path
          import re

          files = [
              Path('src/main/java/com/talhanation/recruits/network/MessageToClientUpdateClaim.java'),
              Path('src/main/java/com/talhanation/recruits/network/MessageToClientUpdateClaims.java'),
              Path('src/main/java/com/talhanation/recruits/network/MessageToClientWorldMapIdentity.java'),
          ]

          for p in files:
              s = p.read_text()
              package_match = re.search(r'^package\s+[^;]+;\n', s, re.M)
              if package_match is None:
                  raise SystemExit(f'package missing: {p}')
              imports = (
                  'import net.neoforged.api.distmarker.Dist;\n'
                  'import net.neoforged.api.distmarker.OnlyIn;\n'
              )
              if 'import net.neoforged.api.distmarker.OnlyIn;' not in s:
                  s = s[:package_match.end()] + '\n' + imports + s[package_match.end():]
              marker = '    @Override\n    public void executeClientSide(RecruitsNetworkContext context) {'
              replacement = '    @Override\n    @OnlyIn(Dist.CLIENT)\n    public void executeClientSide(RecruitsNetworkContext context) {'
              if marker not in s:
                  raise SystemExit(f'executeClientSide marker missing: {p}')
              s = s.replace(marker, replacement, 1)
              p.write_text(s)

          p = Path('src/main/java/com/talhanation/recruits/network/MessageToClientUpdateClaim.java')
          s = p.read_text()
          for signature in (
              '    private void updateOrAddClaim(RecruitsClaim newClaim) {',
              '    private void removeClaim(RecruitsClaim removedClaim) {',
          ):
              if signature not in s:
                  raise SystemExit(f'helper signature missing: {signature}')
              s = s.replace(signature, '    @OnlyIn(Dist.CLIENT)\n' + signature, 1)
          p.write_text(s)
          PY

          git add \
            src/main/java/com/talhanation/recruits/network/MessageToClientUpdateClaim.java \
            src/main/java/com/talhanation/recruits/network/MessageToClientUpdateClaims.java \
            src/main/java/com/talhanation/recruits/network/MessageToClientWorldMapIdentity.java
          git diff --cached --check
          git diff --cached --name-status > "$OUT/repaired-files.tsv"
          git commit -m 'Restore client-only packet execution boundaries'
          git push origin HEAD:sync/neoforge-1.21.1-upstream-1.15.2
          git rev-parse HEAD | tee "$OUT/repaired-head.txt"

          chmod +x gradlew
          ./gradlew --no-daemon clean compileJava shadowJar --stacktrace 2>&1 | tee "$OUT/build.log"
          echo 'build=PASS' > "$OUT/build-result.txt"
      - name: Upload repair evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recruits-client-packet-boundary-repair
          path: ${{ runner.temp }}/client-packet-boundary/evidence
          if-no-files-found: warn
          retention-days: 7
