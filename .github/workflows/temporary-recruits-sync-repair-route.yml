name: Temporary Recruits Common API Foundation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Repair common API foundation
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/common-api-foundation"
          REPO="$ROOT/repo"
          OUT="$ROOT/evidence"
          mkdir -p "$OUT"
          exec > >(tee "$OUT/repair.log") 2>&1

          git clone --branch sync/neoforge-1.21.1-upstream-1.15.2 "https://x-access-token:${GH_TOKEN}@github.com/nekomario28/recruits.git" "$REPO"
          cd "$REPO"
          test "$(git rev-parse HEAD)" = "953cab516d8418170fe03a1c5e0c6784521e5d84"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

          cat > src/main/java/com/talhanation/recruits/world/RecruitsWorldSaveData.java <<'JAVA'
          package com.talhanation.recruits.world;

          import net.minecraft.core.HolderLookup;
          import net.minecraft.nbt.CompoundTag;
          import net.minecraft.server.level.ServerLevel;
          import net.minecraft.util.datafix.DataFixTypes;
          import net.minecraft.world.level.saveddata.SavedData;

          import java.util.UUID;

          public class RecruitsWorldSaveData extends SavedData {
              private static final String FILE_ID = "recruitsWorldId";
              private static final Factory<RecruitsWorldSaveData> FACTORY = new Factory<>(
                      RecruitsWorldSaveData::new,
                      RecruitsWorldSaveData::load,
                      DataFixTypes.LEVEL);

              private UUID worldId;

              public RecruitsWorldSaveData() {
                  this.worldId = UUID.randomUUID();
                  this.setDirty();
              }

              private RecruitsWorldSaveData(UUID worldId) {
                  this.worldId = worldId == null ? UUID.randomUUID() : worldId;
                  if (worldId == null) this.setDirty();
              }

              public static RecruitsWorldSaveData get(ServerLevel level) {
                  return level.getDataStorage().computeIfAbsent(FACTORY, FILE_ID);
              }

              public static RecruitsWorldSaveData load(CompoundTag nbt, HolderLookup.Provider registries) {
                  UUID worldId = nbt.hasUUID("WorldId") ? nbt.getUUID("WorldId") : null;
                  return new RecruitsWorldSaveData(worldId);
              }

              @Override
              public CompoundTag save(CompoundTag nbt, HolderLookup.Provider registries) {
                  nbt.putUUID("WorldId", worldId);
                  return nbt;
              }

              public UUID getWorldId() {
                  return worldId;
              }
          }
          JAVA

          python3 - <<'PY'
          from pathlib import Path
          import re

          def add_import(path, imp):
              p = Path(path)
              s = p.read_text()
              line = f'import {imp};\n'
              if line in s:
                  return
              m = re.search(r'^package\s+[^;]+;\n', s, re.M)
              if m is None:
                  raise SystemExit(f'package declaration missing: {path}')
              p.write_text(s[:m.end()] + '\n' + line + s[m.end():])

          add_import('src/main/java/com/talhanation/recruits/client/gui/component/BannerRenderer.java', 'java.util.List')
          add_import('src/main/java/com/talhanation/recruits/network/MessageTeleportPlayer.java', 'net.minecraft.world.entity.player.Player')
          add_import('src/main/java/com/talhanation/recruits/world/RecruitsPlayerUnitManager.java', 'net.minecraft.world.level.entity.EntityTypeTest')

          client = Path('src/main/java/com/talhanation/recruits/config/RecruitsClientConfig.java')
          s = client.read_text()
          class_marker = 'public class RecruitsClientConfig {\n'
          enum_block = '''public class RecruitsClientConfig {
              public enum MapPlayerIconStyle {
                  VANILLA,
                  OVERHAULED
              }
          '''
          if class_marker not in s:
              raise SystemExit('client config class marker missing')
          s = s.replace(class_marker, enum_block, 1)
          decl_marker = '    public static ModConfigSpec.BooleanValue UpdateMapTiles;\n'
          decls = '''    public static ModConfigSpec.BooleanValue UpdateMapTiles;
              public static ModConfigSpec.BooleanValue WorldMapUpdateAroundPlayer;
              public static ModConfigSpec.BooleanValue WorldMapNightShading;
              public static ModConfigSpec.BooleanValue WorldMapShowCoordinates;
              public static ModConfigSpec.BooleanValue WorldMapClaimFill;
              public static ModConfigSpec.BooleanValue RecruitsToasts;
              public static ModConfigSpec.EnumValue<MapPlayerIconStyle> WorldMapPlayerIconStyle;
          '''
          if decl_marker not in s:
              raise SystemExit('client config declaration marker missing')
          s = s.replace(decl_marker, decls, 1)
          client.write_text(s)

          server = Path('src/main/java/com/talhanation/recruits/config/RecruitsServerConfig.java')
          s = server.read_text()
          marker = '    public static ModConfigSpec.BooleanValue RecruitsStarving;\n'
          replacement = '''    public static ModConfigSpec.BooleanValue RecruitsStarving;
              public static ModConfigSpec.BooleanValue RecruitsUpdateHungerAndMorale;
          '''
          if marker not in s:
              raise SystemExit('server starving declaration marker missing')
          s = s.replace(marker, replacement, 1)
          marker = '    public static ModConfigSpec.IntValue ChunkCost;\n'
          replacement = '''    public static ModConfigSpec.IntValue ChunkCost;
              public static ModConfigSpec.IntValue MaxClaimChunks;
          '''
          if marker not in s:
              raise SystemExit('server claim declaration marker missing')
          s = s.replace(marker, replacement, 1)
          server.write_text(s)

          corpse = Path('src/main/java/com/talhanation/recruits/compat/corpse/RecruitCorpseSpawner.java')
          s = corpse.read_text()
          s = s.replace('import net.minecraft.nbt.CompoundTag;\n', 'import net.minecraft.core.HolderLookup;\nimport net.minecraft.nbt.CompoundTag;\n', 1)
          s = s.replace('items.add(saveEquipmentItem(recruit.getInventory().getItem(slot)));',
                        'items.add(saveEquipmentItem(recruit.getInventory().getItem(slot), recruit.registryAccess()));')
          s = s.replace('Optional<CompoundTag> itemTag = saveItem(recruit.getInventory().getItem(inventorySlot));',
                        'Optional<CompoundTag> itemTag = saveItem(recruit.getInventory().getItem(inventorySlot), recruit.registryAccess());')
          s = s.replace('private static Optional<CompoundTag> saveItem(ItemStack stack) {',
                        'private static Optional<CompoundTag> saveItem(ItemStack stack, HolderLookup.Provider registries) {')
          old = '''        CompoundTag itemTag = new CompoundTag();
                  stack.save(itemTag);
          '''
          new = '''        CompoundTag itemTag = ((CompoundTag) stack.save(registries)).copy();
          '''
          if old not in s:
              raise SystemExit('old ItemStack save body missing')
          s = s.replace(old, new, 1)
          s = s.replace('private static CompoundTag saveEquipmentItem(ItemStack stack) {',
                        'private static CompoundTag saveEquipmentItem(ItemStack stack, HolderLookup.Provider registries) {')
          s = s.replace('return saveItem(stack).orElseGet(RecruitCorpseSpawner::emptyItemTag);',
                        'return saveItem(stack, registries).orElseGet(RecruitCorpseSpawner::emptyItemTag);')
          corpse.write_text(s)

          classifier = Path('src/main/java/com/talhanation/recruits/client/gui/worldmap/color/MapStateClassifier.java')
          s = classifier.read_text().replace('block == Blocks.GRASS', 'block == Blocks.SHORT_GRASS')
          classifier.write_text(s)

          popup_fields = {
              'src/main/java/com/talhanation/recruits/client/gui/worldmap/route/RouteNamePopup.java': 'nameField',
              'src/main/java/com/talhanation/recruits/client/gui/worldmap/route/RouteEditPopup.java': 'nameField',
              'src/main/java/com/talhanation/recruits/client/gui/worldmap/route/WaypointEditPopup.java': 'waitField',
          }
          for path, field in popup_fields.items():
              p = Path(path)
              s = p.read_text()
              pattern = rf'\n\s*if \(visible && {field} != null\) {field}\.tick\(\);'
              s, count = re.subn(pattern, '', s, count=1)
              if count != 1:
                  raise SystemExit(f'EditBox tick call count for {path}: {count}')
              p.write_text(s)
          PY

          git add -A
          git diff --cached --check
          git diff --cached --name-status > "$OUT/repaired-files.tsv"
          git diff --cached --stat > "$OUT/repair-stat.txt"
          git commit -m 'Port common configuration and save APIs to 1.21.1'
          git push origin HEAD:sync/neoforge-1.21.1-upstream-1.15.2
          git rev-parse HEAD | tee "$OUT/repaired-head.txt"

          chmod +x gradlew
          set +e
          ./gradlew --no-daemon clean compileJava --stacktrace 2>&1 | tee "$OUT/compile.log"
          RC=${PIPESTATUS[0]}
          set -e
          echo "compile_exit_code=$RC" > "$OUT/compile-result.txt"
          grep -E '^.*error:|FAILURE: Build failed|BUILD SUCCESSFUL' "$OUT/compile.log" > "$OUT/compile-key-lines.txt" || true
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recruits-common-api-foundation
          path: ${{ runner.temp }}/common-api-foundation/evidence
          if-no-files-found: warn
          retention-days: 7
