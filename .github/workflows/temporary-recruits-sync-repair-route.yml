name: Temporary Recruits Route Syntax Repair

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Patch isolated sync branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/route-repair"
          REPO="$ROOT/repo"
          OUT="$ROOT/evidence"
          mkdir -p "$OUT"
          git clone --branch sync/neoforge-1.21.1-upstream-1.15.2 "https://x-access-token:${GH_TOKEN}@github.com/nekomario28/recruits.git" "$REPO"
          cd "$REPO"
          test "$(git rev-parse HEAD)" = "fbc824d1524d9dd9ebf862fe61382f326e7e4d5f"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/main/java/com/talhanation/recruits/client/gui/worldmap/route/RouteEditPopup.java')
          s = p.read_text()
          old = "                });\n    }\n\n    private void deleteRoute()"
          new = "                }));\n    }\n\n    private void deleteRoute()"
          assert s.count(old) == 1, s.count(old)
          p.write_text(s.replace(old, new, 1))
          PY
          git add src/main/java/com/talhanation/recruits/client/gui/worldmap/route/RouteEditPopup.java
          git diff --cached --check
          git commit -m 'Fix route transfer screen construction'
          git push origin HEAD:sync/neoforge-1.21.1-upstream-1.15.2
          git rev-parse HEAD | tee "$OUT/repaired-head.txt"
          chmod +x gradlew
          set +e
          ./gradlew --no-daemon clean compileJava --stacktrace 2>&1 | tee "$OUT/compile.log"
          RC=${PIPESTATUS[0]}
          set -e
          echo "compile_exit_code=$RC" > "$OUT/compile-result.txt"
          grep -E '^.*error:|FAILURE: Build failed|BUILD SUCCESSFUL' "$OUT/compile.log" > "$OUT/compile-key-lines.txt" || true
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recruits-route-syntax-repair
          path: ${{ runner.temp }}/route-repair/evidence
          if-no-files-found: error
          retention-days: 7
