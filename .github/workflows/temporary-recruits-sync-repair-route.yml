name: Temporary Recruits World Map Alignment

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Align exact upstream world map tree
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/worldmap-align"
          REPO="$ROOT/repo"
          OUT="$ROOT/evidence"
          mkdir -p "$OUT"
          exec > >(tee "$OUT/align.log") 2>&1

          git clone --branch sync/neoforge-1.21.1-upstream-1.15.2 "https://x-access-token:${GH_TOKEN}@github.com/nekomario28/recruits.git" "$REPO"
          cd "$REPO"
          test "$(git rev-parse HEAD)" = "8c6e6e2af59cd570b279a516a144733421a81490"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git remote add upstream https://github.com/talhanation/recruits.git
          git fetch --no-tags upstream cff03e085d65653406a8b6ddcdd0ebff615c3e48

          git restore --source=cff03e085d65653406a8b6ddcdd0ebff615c3e48 --staged --worktree -- \
            src/main/java/com/talhanation/recruits/client/gui/worldmap
          git diff --cached --check
          git diff --cached --name-status > "$OUT/aligned-files.tsv"
          git diff --cached --stat > "$OUT/alignment-stat.txt"
          test -n "$(git diff --cached --name-only)"

          git commit -m 'Align world map tree with upstream 1.15.2'
          git push origin HEAD:sync/neoforge-1.21.1-upstream-1.15.2
          git rev-parse HEAD | tee "$OUT/aligned-head.txt"

          chmod +x gradlew
          set +e
          ./gradlew --no-daemon clean compileJava --stacktrace 2>&1 | tee "$OUT/compile.log"
          RC=${PIPESTATUS[0]}
          set -e
          echo "compile_exit_code=$RC" > "$OUT/compile-result.txt"
          grep -E '^.*error:|FAILURE: Build failed|BUILD SUCCESSFUL' "$OUT/compile.log" > "$OUT/compile-key-lines.txt" || true
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recruits-worldmap-alignment
          path: ${{ runner.temp }}/worldmap-align/evidence
          if-no-files-found: warn
          retention-days: 7
