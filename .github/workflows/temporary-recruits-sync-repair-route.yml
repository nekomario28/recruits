name: Temporary Recruits World Map Signature Finish

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Finish WorldMapScreen signatures
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/worldmap-signature-finish"
          REPO="$ROOT/repo"
          OUT="$ROOT/evidence"
          mkdir -p "$OUT"
          exec > >(tee "$OUT/repair.log") 2>&1
          git clone --branch sync/neoforge-1.21.1-upstream-1.15.2 "https://x-access-token:${GH_TOKEN}@github.com/nekomario28/recruits.git" "$REPO"
          cd "$REPO"
          test "$(git rev-parse HEAD)" = "b6b1fb71b3d5414d85d92a60ae42958ce632eb4f"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/main/java/com/talhanation/recruits/client/gui/worldmap/WorldMapScreen.java')
          s = p.read_text()
          replacements = {
              'renderBackground(guiGraphics);': 'renderBackground(guiGraphics, mouseX, mouseY, partialTicks);',
              'mouseScrolled(width / 2.0, height / 2.0, 1);': 'mouseScrolled(width / 2.0, height / 2.0, 0.0, 1.0);',
              'mouseScrolled(width / 2.0, height / 2.0, -1);': 'mouseScrolled(width / 2.0, height / 2.0, 0.0, -1.0);',
          }
          for old, new in replacements.items():
              if s.count(old) != 1:
                  raise SystemExit(f'{old!r} count={s.count(old)}')
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          git add src/main/java/com/talhanation/recruits/client/gui/worldmap/WorldMapScreen.java
          git diff --cached --check
          git diff --cached --name-status > "$OUT/repaired-files.tsv"
          git commit -m 'Complete world map input signatures for 1.21.1'
          git push origin HEAD:sync/neoforge-1.21.1-upstream-1.15.2
          git rev-parse HEAD | tee "$OUT/repaired-head.txt"
          chmod +x gradlew
          set +e
          ./gradlew --no-daemon clean compileJava --stacktrace 2>&1 | tee "$OUT/compile.log"
          RC=${PIPESTATUS[0]}
          set -e
          echo "compile_exit_code=$RC" > "$OUT/compile-result.txt"
          grep -E '^.*error:|FAILURE: Build failed|BUILD SUCCESSFUL' "$OUT/compile.log" > "$OUT/compile-key-lines.txt" || true
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recruits-worldmap-signature-finish
          path: ${{ runner.temp }}/worldmap-signature-finish/evidence
          if-no-files-found: warn
          retention-days: 7
