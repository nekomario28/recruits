name: Temporary Recruits Restore Syntax Baseline

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore-and-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      WORK_BRANCH: sync/neoforge-1.21.1-upstream-1.15.2
      EXPECTED_SYNC_SHA: 407a48368b44c6cd9a98e826915f6943a432441e
      STABLE_PORT_SHA: 1848e8ec33376f8a933945d4704b3e4c49920d8e
    steps:
      - name: Check out harness
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Restore three validated syntax baselines
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/recruits-syntax-restore"
          REPO="$ROOT/repo"
          OUT="$ROOT/evidence"
          mkdir -p "$OUT"

          git clone --branch "$WORK_BRANCH" \
            "https://x-access-token:${GH_TOKEN}@github.com/nekomario28/recruits.git" "$REPO"
          cd "$REPO"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SYNC_SHA"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch --no-tags origin "$STABLE_PORT_SHA"

          git checkout "$STABLE_PORT_SHA" -- \
            src/main/java/com/talhanation/recruits/commands/RecruitsAdminCommands.java \
            src/main/java/com/talhanation/recruits/world/RecruitsClaimManager.java \
            src/main/java/com/talhanation/recruits/entities/ai/navigation/RecruitsPathNodeEvaluator.java

          git diff --cached --check
          git diff --cached --stat > "$OUT/restored-files-stat.txt"
          git diff --cached --name-status > "$OUT/restored-files.tsv"
          test "$(git diff --cached --name-only | wc -l)" -eq 3

          git commit -m 'Restore validated port implementations after upstream merge'
          git push origin "HEAD:$WORK_BRANCH"
          git rev-parse HEAD | tee "$OUT/restored-head.txt"

      - name: Compile restored sync branch
        shell: bash
        run: |
          set -euo pipefail
          REPO="$RUNNER_TEMP/recruits-syntax-restore/repo"
          OUT="$RUNNER_TEMP/recruits-syntax-restore/evidence"
          cd "$REPO"
          chmod +x gradlew
          set +e
          ./gradlew --no-daemon clean compileJava --stacktrace 2>&1 | tee "$OUT/compile.log"
          COMPILE_RC=${PIPESTATUS[0]}
          set -e
          printf 'compile_exit_code=%s\n' "$COMPILE_RC" > "$OUT/compile-result.txt"
          grep -E '^.*error:|FAILURE: Build failed|BUILD SUCCESSFUL' "$OUT/compile.log" \
            > "$OUT/compile-key-lines.txt" || true

      - name: Upload restore evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recruits-syntax-baseline-restore
          path: ${{ runner.temp }}/recruits-syntax-restore/evidence
          if-no-files-found: error
          retention-days: 7
