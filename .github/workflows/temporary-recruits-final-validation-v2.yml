name: Temporary Recruits Final Validation V2

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  final-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Check out validation branch
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Run exact-source Recruits GameTests
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/recruits-final"
          SOURCE="$ROOT/recruits-gametest"
          mkdir -p "$ROOT"
          git clone https://github.com/nekomario28/recruits.git "$SOURCE"
          cd "$SOURCE"
          git checkout --detach 430599eb53db39d67baf494dda9f22827adb2068
          test "$(git rev-parse HEAD)" = "430599eb53db39d67baf494dda9f22827adb2068"
          chmod +x gradlew

          mkdir -p src/main/java/com/talhanation/recruits/gametest
          cp "$GITHUB_WORKSPACE/.github/temporary-recruits-final/RecruitsFinalGameTests.java" \
            src/main/java/com/talhanation/recruits/gametest/RecruitsFinalGameTests.java
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/main/java/com/talhanation/recruits/gametest/RecruitsFinalGameTests.java')
          s = p.read_text()
          s = s.replace('EntityType.loadEntityRecursive(tag, level, entity -> entity).orElse(null)',
                        'EntityType.loadEntityRecursive(tag, level, entity -> entity)')
          s = s.replace('EntityType.loadEntityRecursive(tag, level, value -> value).orElse(null)',
                        'EntityType.loadEntityRecursive(tag, level, value -> value)')
          p.write_text(s)
          PY

          cat >> build.gradle <<'GRADLE'

          neoForge {
              runs {
                  gameTestServer {
                      type = "gameTestServer"
                      gameDirectory = project.file('run-final-gametest')
                      systemProperty 'neoforge.enabledGameTestNamespaces', 'recruits,minecraft'
                  }
              }
          }
          GRADLE

          mkdir -p src/main/resources/data/minecraft/structure
          python3 - <<'PY'
          from pathlib import Path
          import gzip, struct
          def u16(v): return struct.pack('>H', v)
          def i32(v): return struct.pack('>i', v)
          def name(v):
              b=v.encode(); return u16(len(b))+b
          def tint(k,v): return b'\x03'+name(k)+i32(v)
          def tstr(k,v):
              b=v.encode(); return b'\x08'+name(k)+u16(len(b))+b
          def tli(k,vs): return b'\x09'+name(k)+b'\x03'+i32(len(vs))+b''.join(i32(v) for v in vs)
          def comp(tags): return b''.join(tags)+b'\x00'
          def tlc(k,vs): return b'\x09'+name(k)+b'\x0a'+i32(len(vs))+b''.join(vs)
          root=b'\x0a'+name('')+comp([
              tint('DataVersion',3955),tli('size',[7,3,7]),
              tlc('palette',[comp([tstr('Name','minecraft:stone')])]),
              tlc('blocks',[comp([tli('pos',[0,0,0]),tint('state',0)])]),
              tlc('entities',[])])
          Path('src/main/resources/data/minecraft/structure/empty.nbt').write_bytes(gzip.compress(root,mtime=0))
          PY

          ./gradlew --no-daemon clean runGameTestServer shadowJar --stacktrace --info 2>&1 \
            | tee "$RUNNER_TEMP/recruits-final-gametest.log"
          grep -F "All 5 required tests passed" "$RUNNER_TEMP/recruits-final-gametest.log"
          JAR="$(find build/libs -maxdepth 1 -name '*-all.jar' -print -quit)"
          test -n "$JAR"
          cp "$JAR" "$RUNNER_TEMP/recruits-gametest-build.jar"

      - name: Build exact-source restart-probe JAR
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/recruits-final"
          SOURCE="$ROOT/recruits-dedicated"
          git clone https://github.com/nekomario28/recruits.git "$SOURCE"
          cd "$SOURCE"
          git checkout --detach 430599eb53db39d67baf494dda9f22827adb2068
          test "$(git rev-parse HEAD)" = "430599eb53db39d67baf494dda9f22827adb2068"
          chmod +x gradlew
          mkdir -p src/main/java/com/talhanation/recruits/finaltest
          cp "$GITHUB_WORKSPACE/.github/temporary-recruits-final/RecruitsFinalRestartProbe.java" \
            src/main/java/com/talhanation/recruits/finaltest/RecruitsFinalRestartProbe.java
          ./gradlew --no-daemon clean shadowJar --stacktrace 2>&1 \
            | tee "$RUNNER_TEMP/recruits-dedicated-build.log"
          JAR="$(find build/libs -maxdepth 1 -name '*-all.jar' -print -quit)"
          test -n "$JAR"
          cp "$JAR" "$RUNNER_TEMP/recruits-final-restart.jar"

      - name: Static and JAR audit
        shell: bash
        run: |
          set -euo pipefail
          SOURCE="$RUNNER_TEMP/recruits-final/recruits-dedicated"
          JAR="$RUNNER_TEMP/recruits-final-restart.jar"
          OUT="$RUNNER_TEMP/recruits-audit.txt"
          {
            echo 'Recruits final static audit'
            echo 'commit=430599eb53db39d67baf494dda9f22827adb2068'
            echo 'minecraft=1.21.1'
            echo 'neoforge=21.1.219'
            echo 'java=21'
            echo
            echo '[git diff check]'
            git -C "$SOURCE" diff --check
            echo 'PASS'
            echo
            echo '[legacy Forge imports]'
            if grep -R --line-number --include='*.java' 'net\.minecraftforge\.' "$SOURCE/src"; then
              echo 'FAIL: legacy Forge imports remain'
              exit 1
            else
              echo 'PASS: none'
            fi
            echo
            echo '[common-side client references outside client packages]'
            grep -R --line-number --include='*.java' 'net\.minecraft\.client\|com\.mojang\.blaze3d' \
              "$SOURCE/src/main/java/com/talhanation/recruits" \
              | grep -v '/client/' \
              | grep -v '/compat/client/' || true
            echo
            echo '[printStackTrace occurrences]'
            grep -R --line-number --include='*.java' 'printStackTrace' "$SOURCE/src" || true
            echo
            echo '[tracked build/editor/cache files]'
            git -C "$SOURCE" ls-files \
              | grep -E '(^|/)(\.gradle|\.idea|build|run)/|\.iml$|\.class$|\.jar$|\.zip$' || true
            echo
            echo '[JAR integrity]'
            unzip -t "$JAR" >/dev/null
            echo 'PASS'
            echo
            echo '[JAR duplicate entries]'
            python3 - "$JAR" <<'PY'
          import sys, zipfile
          from collections import Counter
          jar=sys.argv[1]
          with zipfile.ZipFile(jar) as z:
              counts=Counter(z.namelist())
          duplicates=[name for name,count in counts.items() if count>1]
          print(f'duplicate_entries={len(duplicates)}')
          if duplicates:
              print('\n'.join(duplicates[:50]))
              raise SystemExit(1)
          PY
            echo
            echo '[unrelocated CoreLib classes]'
            if unzip -Z1 "$JAR" | grep -q '^de/maxhenkel/corelib/'; then
              echo 'FAIL: unrelocated CoreLib classes remain'
              exit 1
            else
              echo 'PASS: none'
            fi
            echo
            echo '[relocated CoreLib classes]'
            test "$(unzip -Z1 "$JAR" | grep -c '^de/maxhenkel/recruits/corelib/' || true)" -gt 0
            echo 'PASS'
          } 2>&1 | tee "$OUT"

      - name: Install NeoForge dedicated server
        shell: bash
        run: |
          set -euo pipefail
          SERVER="$RUNNER_TEMP/recruits-final-server"
          mkdir -p "$SERVER"
          cd "$SERVER"
          curl --fail --location --retry 3 --output neoforge-installer.jar \
            https://maven.neoforged.net/releases/net/neoforged/neoforge/21.1.219/neoforge-21.1.219-installer.jar
          java -jar neoforge-installer.jar --installServer 2>&1 | tee "$RUNNER_TEMP/recruits-server-install.log"
          rm neoforge-installer.jar
          mkdir -p mods
          cp "$RUNNER_TEMP/recruits-final-restart.jar" mods/recruits-final-restart.jar
          printf 'eula=true\n' > eula.txt
          cat > server.properties <<'PROPERTIES'
          online-mode=false
          allow-flight=true
          enable-command-block=true
          level-name=recruits-final-restart-world
          max-tick-time=120000
          view-distance=5
          simulation-distance=5
          spawn-protection=0
          PROPERTIES

      - name: Dedicated process 1 - create and save recruit
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/recruits-final-server"
          timeout 240s bash run.sh nogui 2>&1 | tee "$RUNNER_TEMP/recruits-dedicated-process-1.log"
          test "${PIPESTATUS[0]}" -eq 0
          test -f recruits-final-restart.phase
          test ! -f recruits-final-restart.fail
          grep -F "RECRUITS_FINAL_RESTART_WRITE_OK" "$RUNNER_TEMP/recruits-dedicated-process-1.log"
          test -d recruits-final-restart-world

      - name: Dedicated process 2 - reload and verify recruit
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/recruits-final-server"
          timeout 240s bash run.sh nogui 2>&1 | tee "$RUNNER_TEMP/recruits-dedicated-process-2.log"
          test "${PIPESTATUS[0]}" -eq 0
          test -f recruits-final-restart.pass
          test ! -f recruits-final-restart.fail
          grep -F "RECRUITS_FINAL_RESTART_VERIFY_OK" "$RUNNER_TEMP/recruits-dedicated-process-2.log"
          grep -F "uuid=30000000-0000-0000-0000-000000000003" recruits-final-restart.pass
          grep -F "owner=40000000-0000-0000-0000-000000000004" recruits-final-restart.pass
          grep -F "emeralds=23" recruits-final-restart.pass
          grep -F "mainhand=iron_sword" recruits-final-restart.pass
          grep -F "offhand=shield" recruits-final-restart.pass
          grep -F "helmet=iron_helmet" recruits-final-restart.pass

      - name: Collect final evidence
        if: always()
        shell: bash
        run: |
          set -u
          OUT="$RUNNER_TEMP/recruits-final-evidence"
          mkdir -p "$OUT"
          cp "$RUNNER_TEMP"/*.log "$OUT"/ 2>/dev/null || true
          cp "$RUNNER_TEMP/recruits-audit.txt" "$OUT"/ 2>/dev/null || true
          cp "$RUNNER_TEMP/recruits-final-server"/recruits-final-restart.* "$OUT"/ 2>/dev/null || true
          cp "$RUNNER_TEMP/recruits-final-restart.jar" "$OUT"/ 2>/dev/null || true
          sha256sum "$RUNNER_TEMP/recruits-final-restart.jar" > "$OUT/jar-sha256.txt" 2>/dev/null || true
          cat > "$OUT/manifest.json" <<'JSON'
          {
            "minecraft":"1.21.1",
            "neoforge":"21.1.219",
            "java":"21",
            "recruits_commit":"430599eb53db39d67baf494dda9f22827adb2068",
            "gametests_expected":5,
            "dedicated_server_processes":2,
            "same_world_reused":true,
            "persistence":{"uuid":true,"owner_uuid":true,"inventory":true,"equipment":true,"custom_name":true}
          }
          JSON

      - name: Upload final evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recruits-final-validation-v2
          path: ${{ runner.temp }}/recruits-final-evidence
          if-no-files-found: error
          retention-days: 3
