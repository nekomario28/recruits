name: Temporary Recruits Apply Client Separation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-client-separation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out patch
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Apply patch to exact port head
        shell: bash
        run: |
          set -euo pipefail
          SOURCE="$RUNNER_TEMP/recruits-client-separation"
          git clone --branch port/neoforge-1.21.1 https://github.com/nekomario28/recruits.git "$SOURCE"
          cd "$SOURCE"
          test "$(git rev-parse HEAD)" = "ffe044eea112eca9c464027c7e7a37cda1b5f741"
          git apply --check "$GITHUB_WORKSPACE/.github/temporary-recruits-final/client-villager-events.patch"
          git apply "$GITHUB_WORKSPACE/.github/temporary-recruits-final/client-villager-events.patch"
          git diff --check
          ! grep -n 'net.minecraft.client\|com.talhanation.recruits.client' src/main/java/com/talhanation/recruits/VillagerEvents.java
          grep -F 'new ClientVillagerEvents()' src/main/java/com/talhanation/recruits/Main.java

      - name: Compile patched common and client source
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/recruits-client-separation"
          chmod +x gradlew
          ./gradlew --no-daemon clean compileJava --stacktrace 2>&1 | tee "$RUNNER_TEMP/recruits-client-separation-build.log"

      - name: Commit patched source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/recruits-client-separation"
          git add src/main/java/com/talhanation/recruits/VillagerEvents.java \
                  src/main/java/com/talhanation/recruits/Main.java \
                  src/main/java/com/talhanation/recruits/client/events/ClientVillagerEvents.java
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'Separate client-only villager events'
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/nekomario28/recruits.git"
          git fetch origin port/neoforge-1.21.1
          git rebase origin/port/neoforge-1.21.1
          git push origin HEAD:port/neoforge-1.21.1
          git rev-parse HEAD | tee "$RUNNER_TEMP/recruits-client-separation-head.txt"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recruits-client-event-separation
          path: |
            ${{ runner.temp }}/recruits-client-separation-build.log
            ${{ runner.temp }}/recruits-client-separation-head.txt
          if-no-files-found: warn
          retention-days: 3
